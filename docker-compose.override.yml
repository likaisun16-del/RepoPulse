services:
  api:
    command: ["sh", "-c", "cd /app/backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend:/app/backend

  worker:
    volumes:
      - ./backend:/app/backend
      - ./worker:/app/worker

  beat:
    volumes:
      - ./backend:/app/backend
      - ./worker:/app/worker
