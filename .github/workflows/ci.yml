name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:..
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app ../worker tests
      - run: mypy app ../worker
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -e ../backend
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start API
        run: |
          nohup python -m uvicorn app.main:app --app-dir ../backend --host 127.0.0.1 --port 8000 > /tmp/repopulse-api.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
      - run: npm test -- --project=chromium
